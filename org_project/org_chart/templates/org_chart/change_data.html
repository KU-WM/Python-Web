<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>✏ Update Data</h1>

    <form method="POST" name="update" onsubmit='return confirm("수정하시겠습니까?")'>
        {% csrf_token %}
        
        {% for field in form %}
            <label>{{ field.label }}</label>
            {{ field }}
            <br><br>
        {% endfor %}

        <button type='submit'>💾 Update</button>
    </form>
</body>
</html>
