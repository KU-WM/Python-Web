<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>급여 변경 완료</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">

<h2 class="text-success mb-4">✅ 급여 변경이 완료되었습니다!</h2>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">직원 정보</h5>
            <p><strong>이름:</strong> {{form.firstName}}</p>
            <p><strong>이메일:</strong> {{form.email}}</p>
            <p><strong>부서:</strong>{{form.departmentId}}</p>
            <p><strong>현재 급여:</strong>{{from.salary}}</p>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title">📜 급여 변경 이력</h5>
            <ul class="list-group">
                {% for data in datas %}
                    <li class="list-group-item">
                        {{ data.changeDate }} - {{data.oldSalary}} → {{data.salary}} (by {{data.changedBy}})
                    </li>
                {% endfor %}
            </ul>
        </div>
    </div>

    <a href="{% url 'employeeList' %}">🔙 Back to Employee List</a>
</body>
</html>
