<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>급여 변경</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">

  <h2 class="mb-4">💼 직원 급여 변경</h2>

  <form id="salaryForm" method="POST" action="/update_salary/">
    <!-- CSRF 토큰은 Django에서 자동 삽입됨 -->
    <div class="mb-3">
      <label class="form-label">부서 선택</label>
      <select id="deptSelect" class="form-select">
        <option selected disabled>-- 부서 선택 --</option>
        {% for dept in departments %}
          <option value="{{dept.dept_id}}"> {{dept.name}} </option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">직원 선택</label>
      <select id="empSelect" name="emp_id" class="form-select">
        <option selected disabled>-- 직원 선택 --</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">현재 급여</label>
      <input type="text" id="currentSalary" class="form-control" readonly value="">
    </div>

    <div class="mb-3">
      <label class="form-label">변경할 급여</label>
      <input type="number" id="newSalary" name="new_salary" class="form-control">
    </div>

    <button type="button" class="btn btn-primary" onclick="checkAndSubmit()">급여 변경</button>
  </form>

  <script>
    let currentSalary = '';
    let currentName = '';

    document.getElementById('deptSelect').addEventListener('change', function () {
      const deptId = this.value;

      console.log('#### selected dept_id : ', deptId);
      document.getElementById('currentSalary').value = '';
      document.getElementById('newSalary').value = '';

      const empSelect = document.getElementById('empSelect');
      empSelect.innerHTML = '<option selected disabled>-- 직원 선택 --</option>';

      /* employeeData[deptId]?.forEach(emp => {
        const option = document.createElement('option');
        option.value = emp.id;
        option.textContent = emp.name;
        option.dataset.salary = emp.salary;
        empSelect.appendChild(option);
      }); */

      // Ajax 요청(URL : http://localhost:8000/get_employees/?dept_id=10)
      fetch(`/get_employees/?dept_id=${deptId}`)
        .then(response => response.json())
        .then(data => {
          console.log("data: ", data);
          data.forEach(emp => {
            const option = document.createElement('option');
            option.value = emp.emp_id;
            option.dataset.salary = emp.salary;
            option.textContent = emp.first_name + ' ' + emp.last_name;
            empSelect.appendChild(option);
          });
        })
    });

    document.getElementById('empSelect').addEventListener('change', function () {
      const selectedOption = this.options[this.selectedIndex];
      currentSalary = parseInt(selectedOption.dataset.salary);
      currentName = selectedOption.textContent;
      document.getElementById('currentSalary').value = currentSalary;
    }); 


    function checkAndSubmit() {
      const newSalary = parseInt(document.getElementById('newSalary').value);
      if (isNaN(newSalary)) {
        alert("변경할 급여를 입력하세요.");
        return;
      }

      if (newSalary < currentSalary) {
        if (!confirm("현재 금액보다 작은데 진행할까요?")) return;
      }

      if (confirm(`${currentName}님 급여를 ${currentSalary} => ${newSalary} 로 변경합니다!!`)) {
        document.getElementById('salaryForm').submit();
      }
    }
  </script>
</body>
</html>
