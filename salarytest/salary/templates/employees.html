<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>직원 목록</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    function confirmDelete(empId) {
      const confirmDelete = confirm("해당 직원 정보를 삭제하겠습니까?");
      if (confirmDelete) {
        const link = document.createElement('a');

        url = `http://localhost:8000/deleteemployee/?emp_id=${empId}`
        link.href = url;
        link.click();
      }
    }
  </script>
  <style>
    .box {
      display: flex;
      position: relative;
    }

    #choice {
      position: absolute;
      right: 10px;
    }
  </style>
</head>
<body class="container my-5">

  <div class='box'>
    <h2 class="mb-4">👥 직원 목록</h2>
    <a href="{% url 'salary_update' %}" class="btn btn-outline-primary btn-sm" id='choice'>급여수정</a>
  </div>

  <table class="table table-bordered table-hover">
    <thead class="table-dark">
      <tr>
        <th>부서명</th>
        <th>직원명</th>
        <th>급여</th>
        <th>관리</th>
      </tr>
    </thead>
    <tbody>
      {% for employee in employees %}
        <tr id=`emp-row-{{employee.emp_id}}`>
          <td>{{ employee.department }}</td>
          <td>{{ employee.first_name }}</td>
          <td>{{employee.salary}}</td>
          <td>
            <a href="{% url 'salary_his_list' employee.emp_id %}" class="btn btn-outline-secondary btn-sm">이력보기</a>
            <a href="{% url 'updateSalary' employee.emp_id %}" class="btn btn-outline-primary btn-sm">급여수정</a>
            <button class="btn btn-outline-danger btn-sm" onclick="confirmDelete({{employee.emp_id}})">삭제</button>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
