<!DOCTYPE html>
<html>
<head>
    <title>Book List</title>
</head>
<body>
    <h1>📚 Book List</h1>

    <a href="{% url 'create_book' %}">➕ Add a New Book</a>
    <a href="{% url 'create_publisher' %}">➕ Add a New Publisher</a>
    <br><br>

    <ul>
        {% for book in books %}
            <li>
                <strong>{{ book.title }}</strong>
                (Published by: {{ book.publisher.name }}, {{ book.publisher.established_date }})
                <a href="{% url 'update_book' book.id %}">✏ Edit</a> | 
                <a href="{% url 'delete_book' book.id %}">🗑 Delete</a>
            </li>
        {% empty %}
            <li>No books available.</li>
        {% endfor %}
    </ul>
</body>
</html>
