<!DOCTYPE html>
<html>
<head>
    <title>Create Book</title>
</head>
<body>
    <h1>➕ Add a New Book</h1>

    <form method="POST">
        {% csrf_token %}
        
        {% for field in form %}
            <label>{{ field.label }}</label>
            {{ field }}
            <br><br>
        {% endfor %}

        <button type="submit">💾 Save</button>
    </form>

    <br>
    <a href="{% url 'book_list' %}">🔙 Back to List</a>
</body>
</html>
